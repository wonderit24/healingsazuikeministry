<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#182b45">
  <title>Website Administration | HEAM</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbfaf7;color:#282722;font:15px/1.7 "DM Sans",Arial,sans-serif}.setup-card{width:min(560px,calc(100% - 40px));padding:34px;background:white;border:1px solid #e9e6df}.brand{color:#182b45;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}h1{margin:15px 0 8px;color:#182b45;font:500 32px/1.2 Georgia,serif}p{color:#706d67;font-size:13px}a{color:#735c43}.status{margin-top:21px;padding:14px;background:#f1eee8;color:#5e584f;font-size:12px}#cms{width:100%}
  </style>
</head>
<body>
  <main class="setup-card" id="cms-setup">
    <div class="brand">Healings E. Azuike · Website Admin</div>
    <h1>Secure content administration</h1>
    <p>This private editor manages website content in the HEAM GitHub repository. Editors must be authorised in Decap Turbo before they can sign in or publish changes.</p>
    <div class="status" id="setup-status" role="status">Checking the CMS connection…</div>
    <p><a href="/">Return to the public website</a></p>
  </main>
  <script>
    fetch('/admin/config.yml', { cache: 'no-store' }).then((response) => response.text()).then((config) => {
      const siteId = config.match(/^\s*turbo_site_id:\s*([^\s#]+)/m)?.[1];
      if (!siteId || siteId === 'SET_AFTER_OWNER_SETUP') {
        document.querySelector('#setup-status').textContent = 'The owner still needs to create the Decap Turbo site, connect the GitHub repository, authorise editors, and add the site ID to admin/config.yml. Setup steps are in OWNER-SETUP.md.';
        return;
      }
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/decap-cms@^3.17.0/dist/decap-cms.js';
      script.onload = () => document.querySelector('#cms-setup').remove();
      script.onerror = () => { document.querySelector('#setup-status').textContent = 'The content editor could not load. Check the network connection and try again.'; };
      document.body.append(script);
    }).catch(() => { document.querySelector('#setup-status').textContent = 'The CMS configuration could not be loaded. Please try again later.'; });
  </script>
</body>
</html>
